{{/*
Секрет в namespace кластера — используется CAPOS провайдером через identityRef.
Содержит те же аннотации, что и провайдер-секрет в capos-system,
чтобы backend мог обращаться к нему при работе с кластером.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capos-cluster.identitySecretName" . }}
  namespace: {{ .Release.Name }}
  labels:
    shturval.tech/provider: ""
    {{- include "capos-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "capos-cluster.providerAnnotations" . | nindent 4 }}
type: Opaque
data:
  clouds.yaml: {{ include "capos-cluster.cloudsYaml.b64" . | quote }}
  cacert: {{ .Values.capos.cacert | b64enc | quote }}
