{{- include "capos-cluster.preflight" . -}}
apiVersion: cluster.shturval.tech/v1beta1
kind: ClusterConfig
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capos-cluster.labels" . | nindent 4 }}
spec:
  clusterName: {{ .Release.Name }}
  clusterProfileName: {{ .Values.clusterConfigProfileName | default "default-client-cluster-profile" }}
  clusterType: {{ .Values.clusterType | default "client" }}
  deployKeepAlived: {{ not .Values.useExternalKubeAPILB }}
  license: {{ .Values.licensetoken | quote }}
  releaseVersion: {{ .Values.shturvalReleaseVersion | quote }}
  {{- if and .Values.update .Values.update.strategy }}
  update:
    updateStrategy: {{ .Values.update.strategy | quote }}
  {{- end }}
  {{- if hasKey .Values "deletePersistentVolumes" }}
  deletePersistentVolumes: {{ .Values.deletePersistentVolumes }}
  {{- end }}
  secure: {{ .Values.secure }}
  systemRegistry: {{ .Values.systemregistry | quote }}
  ntpConfig:
    {{- if .Values.ntp.ntpservers }}
    ntpServers:
    {{- range .Values.ntp.ntpservers }}
    - {{ . | quote }}
    {{- end }}
    {{- end }}
    timeZone: {{ .Values.ntp.timezone | quote }}
  systemServicesConfig:
    ccm:
      providerSecretRef:
        name: {{ include "capos-cluster.identitySecretName" . | quote }}
        namespace: {{ .Release.Name | quote }}
    csi:
    {{- if .Values.csi }}
    {{- range .Values.csi }}
    - defaultStorageClass: {{ hasKey . "defaultStorageClass" | ternary .defaultStorageClass true }}
      serviceConfigName: {{ .serviceConfigName | quote }}
      {{- if .providerSecretRef }}
      providerSecretRef:
        name: {{ .providerSecretRef.name | quote }}
        namespace: {{ .providerSecretRef.namespace | quote }}
      {{- else if eq .serviceConfigName "shturval-capos-csi" }}
      providerSecretRef:
        name: {{ include "capos-cluster.csiSecretName" $ | quote }}
        namespace: {{ $.Release.Name | quote }}
      {{- end }}
    {{- end }}
    {{- else if .Values.capos.enableCSI }}
    - defaultStorageClass: true
      serviceConfigName: shturval-capos-csi
      providerSecretRef:
        name: {{ include "capos-cluster.csiSecretName" . | quote }}
        namespace: {{ .Release.Name | quote }}
    {{- else }}
    - defaultStorageClass: true
      serviceConfigName: shturval-local-csi
    {{- end }}
    {{- $svc := include "capos-cluster.serviceLists" . | fromYaml }}
    enabledServices:
    {{- range $svc.enabled }}
    {{- if or (not $.Values.capos.enableCSI) (ne . "shturval-local-csi") }}
    - {{ . | quote }}
    {{- end }}
    {{- end }}
    disabledServices:
    {{- $disabled := $svc.disabled | default list }}
    {{- if and .Values.capos.enableCSI (not (has "shturval-local-csi" $disabled)) }}
    {{- $disabled = append $disabled "shturval-local-csi" }}
    {{- end }}
    {{- range $disabled }}
    - {{ . | quote }}
    {{- end }}
    ingress:
      defaultIngressFQDN: {{ printf "*.%s" .Values.ingress | quote }}
      {{- if and .Values.ingressVip (not .Values.useExternalIngressLB) }}
      ingressVIP: {{ .Values.ingressVip | quote }}
      {{- end }}
      setupVIP: {{ not .Values.useExternalIngressLB }}
      {{- if and .Values.ingressControllerType (ne .Values.ingressControllerType "nginx") }}
      controllerType: {{ .Values.ingressControllerType | quote }}
      {{- end }}
      {{- if .Values.ingressCert }}
      wildcardCert:
        ingresscert: {{ .Values.ingressCert | quote }}
        ingresskey: {{ .Values.ingressKey | quote }}
      {{- end }}
      {{- if .Values.caCert }}
      intermediateCA:
        cert: {{ .Values.caCert | quote }}
        key: {{ .Values.caKey | quote }}
      {{- end }}
      {{- if .Values.acme }}
      acmeConfig:
        acmeserverurl: {{ .Values.acme.serverURL | quote }}
        {{- if .Values.acme.rootCABundle }}
        acmerootcabundle: {{ .Values.acme.rootCABundle | quote }}
        {{- end }}
        {{- if .Values.acme.rootCA }}
        acmerootca: {{ .Values.acme.rootCA | quote }}
        {{- end }}
        {{- if .Values.acme.email }}
        email: {{ .Values.acme.email | quote }}
        {{- end }}
      {{- end }}
      {{- if and .Values.vault .Values.vault.server }}
      vaultConfig:
        server: {{ .Values.vault.server | quote }}
        path: {{ required "vault.path обязателен, если задан vault.server" .Values.vault.path | quote }}
        {{- if .Values.vault.mountPath }}
        mountPath: {{ .Values.vault.mountPath | quote }}
        {{- end }}
        {{- if .Values.vault.role }}
        role: {{ .Values.vault.role | quote }}
        {{- end }}
        {{- if .Values.vault.token }}
        tokenSecretRef:
          name: vault-token
        {{- end }}
        {{- if .Values.vault.caBundle }}
        caBundle: {{ .Values.vault.caBundle | b64enc | quote }}
        {{- end }}
        {{- if .Values.vault.rootCA }}
        rootca: {{ .Values.vault.rootCA | b64enc | quote }}
        {{- end }}
      {{- end }}
    loggingConfig:
      {{- if .Values.logsMgmtIngress }}
      loggingUrl: {{ .Values.logsMgmtIngress | quote }}
      {{- end }}
    monitoringConfig:
      monitoringId: {{ include "capos-cluster.monitoringid" . | quote }}
      {{- if .Values.metricsMgmtIngress }}
      monitoringUrl: {{ .Values.metricsMgmtIngress | quote }}
      {{- end }}
