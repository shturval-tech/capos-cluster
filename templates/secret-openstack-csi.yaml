{{- if eq (include "capos-cluster.csiSecretWanted" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capos-cluster.csiSecretName" . }}
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capos-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "capos-cluster.providerAnnotations" . | nindent 4 }}
type: Opaque
data:
  clouds.yaml: {{ include "capos-cluster.cloudsYaml.b64" . | quote }}
  cacert: {{ .Values.capos.cacert | b64enc | quote }}
{{- end }}
