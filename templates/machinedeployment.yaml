{{- range $k, $v := .Values.workerNodes }}
{{- $scale := include "capos-cluster.workerGroupScale" (dict "root" $ "name" $k "group" .) | fromYaml }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ $.Release.Name }}-{{ $k }}
  namespace: {{ $.Release.Name }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
    cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $k }}
    {{- include "capos-cluster.labels" $ | nindent 4 }}
  annotations:
    machinedeployment.clusters.x-k8s.io/revision: "1"
    {{- if $scale.enabled }}
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: {{ $scale.minSize | quote }}
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: {{ $scale.maxMachines | quote }}
    {{- end }}
spec:
  clusterName: {{ $.Release.Name }}
  {{- if not $scale.enabled }}
  replicas: {{ $scale.replicas }}
  {{- end }}
  rollout:
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
      cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $k }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
        cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $k }}
        node-role.kubernetes.io/{{ include "capos-cluster.nodeRole" $k }}: ""
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: {{ $.Release.Name }}-{{ $k }}
      clusterName: {{ $.Release.Name }}
      deletion:
        nodeDeletionTimeoutSeconds: 600
        nodeDrainTimeoutSeconds: 600
        nodeVolumeDetachTimeoutSeconds: 300
      {{- $az := $v.availabilityZone | default (include "capos-cluster.workerPrimaryAZ" $) }}
      {{- if $az }}
      failureDomain: {{ $az | quote }}
      {{- end }}
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: {{ $.Release.Name }}-{{ $k }}
      version: v{{ include "capos-cluster.effectiveKubeVersion" $ }}
---
{{- end }}
