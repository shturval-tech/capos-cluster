{{/*
Провайдер-секрет в namespace capos-system — используется Shturval backend
для предоставления информации о конфигурации провайдера OpenStack.
Backend ищет провайдер-конфиги ТОЛЬКО в capos-system по метке shturval.tech/provider.

Создание можно отключить через capos.createProviderConfig: false,
если провайдер уже существует в capos-system (создан через backend UI).
*/}}
{{- if .Values.capos.createProviderConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capos-cluster.identitySecretName" . }}
  namespace: capos-system
  labels:
    shturval.tech/provider: ""
  annotations:
    {{- include "capos-cluster.providerAnnotations" . | nindent 4 }}
type: Opaque
data:
  clouds.yaml: {{ include "capos-cluster.cloudsYaml.b64" . | quote }}
  cacert: {{ .Values.capos.cacert | b64enc | quote }}
{{- end }}
