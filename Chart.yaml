apiVersion: v2
name: capos-cluster
description: Helm-чарт для развёртывания Cluster API-кластера на провайдере OpenStack (CAPOS) + Shturval ClusterConfig
type: application
version: 0.3.0
appVersion: "2.15.0"
dependencies:
  - name: capsm-cluster-vm
    alias: capos-cluster-vm
    version: 0.1.0
    repository: capsm-cluster-vm
    condition: capos-cluster-vm.enable
  - name: capsm-cluster-grafana
    alias: capos-cluster-grafana
    version: 0.1.0
    repository: capsm-cluster-grafana
    condition: capos-cluster-grafana.enable
